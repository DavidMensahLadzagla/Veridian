name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: api (lint · type · test)
    runs-on: ubuntu-latest
    # 3.13 is the pinned runtime (Django 5.2 LTS). 3.14 is a canary: it tracks whether the
    # C-extension deps (psycopg, cryptography, GDAL/GEOS, pgvector, WeasyPrint) have 3.14
    # wheels yet, and is allowed to fail so it never blocks a merge.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        include:
          - python-version: "3.14"
            experimental: true
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy .
      - name: Migrations are not drifting
        run: python manage.py makemigrations --check --dry-run
      - name: Test
        run: pytest
      # NOTE: once the 32-table schema lands (ADR-0006), add a Postgres service here and point
      # DATABASE_URL at it — integration tests must run against Postgres, not sqlite.
